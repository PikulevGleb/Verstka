<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple</title>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <header class="header">
        <a href="/" class="header-logo">
            <img src="./images/logo.png" alt="Simple Logo" class="header-logo-image"
            width="140" height="23">
        </a>
        <nav class="header-menu">
            <ul class="header-menu-list">
                <li class="header-menu-item">
                    <a href="/" class="header-menu-link">Продукция</a>
                </li>
                <li class="header-menu-item">
                    <a href="/" class="header-menu-link">Материалы</a>
                </li>
                <li class="header-menu-item">
                    <a href="/" class="header-menu-link">О нас</a>
                </li>
                <li class="header-menu-item">
                    <a href="/" class="header-menu-link">Контакты</a>
                </li>
            </ul>
        </nav>
    </header>
    <div class="header-actions">
        <button class="header-book-button button"
        type="button">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M9.00003 17C4.58175 17 1.00003 13.4183 1.00003 9C1.00003 4.58172 4.58175 1 9.00003 1C13.4183 1 17 4.58172 17 9C17 13.4183 13.4183 17 9.00003 17Z"
                    stroke="#4C5866" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
        <button class="header-burger-button"
        type="button">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g clip-path="url(#clip0_1_497)">
                    <path
                        d="M15 3H19C19.5304 3 20.0391 3.21071 20.4142 3.58579C20.7893 3.96086 21 4.46957 21 5V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H15"
                        stroke="#4C5866" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M10 17L15 12L10 7" stroke="#4C5866" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M15 12H3" stroke="#4C5866" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </g>
                <defs>
                    <clipPath id="clip0_1_497">
                        <rect width="24" height="24" fill="white" />
                    </clipPath>
                </defs>
            </svg>
        </button>
    </div>
</body>
</html>
